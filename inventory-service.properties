server.port=8886
spring.application.name=INVENTORY-SERVICE
# Kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092
# Consumer
spring.cloud.stream.bindings.orderCreated-in-0.destination=order-created
# Producers
spring.cloud.stream.bindings.inventory-out-0.destination=inventory-success
spring.cloud.stream.bindings.inventory-failed-out-0.destination=inventory-failed
# Function
spring.cloud.function.definition=orderCreated
# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
