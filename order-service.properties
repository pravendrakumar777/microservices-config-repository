# Server
server.port=8093
spring.application.name=order-service
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/saga_design_pattern
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092
# Producer
spring.cloud.stream.bindings.order-out-0.destination=order-created
# Consumers
spring.cloud.stream.bindings.paymentSuccess-in-0.destination=payment-success
spring.cloud.stream.bindings.paymentFailed-in-0.destination=payment-failed
# Function definition
spring.cloud.function.definition=paymentSuccess;paymentFailed
# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
